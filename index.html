<!DOCTYPE html>
<html lang="vi">
<head>

<title>TAN KA</title>

<style>

font-family:Arial,sans-serif;
}

body{
margin:0;
background:#111;
color:white;
}

header{
text-align:center;
padding:50px 20px;
background:linear-gradient(135deg,#222,#000);
}

h1{
font-size:45px;
color:#ffc400;
}

p{
font-size:18px;
}

section{
padding:30px;

}

.card{

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

.gallery img{
width:100%;

button{

Chào mừng bạn đến với Tan Ka.
Nơi chia sẻ những món ăn đặc sắc và những khoảnh khắc tuyệt vời.

</div>
</section>

<section>
<h2>📸 Hình ảnh</h2>

<div class="gallery">
<img src="https://via.placeholder.com/400">

<footer>

</html>
